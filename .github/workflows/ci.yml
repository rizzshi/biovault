name: BioVault CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test:
    name: Federated Simulation Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Interface Contracts & Modules
        run: |
          python -c "import contracts; print('Contracts verified successfully.')"
          python dp.py
          python model.py
          python metrics.py

      - name: Generate Synthetic Telemetry for Smoke Test
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('samples/mixed_stream.csv')
          smoke_df = pd.concat([df] * 6, ignore_index=True)
          smoke_df.to_csv('synthetic_smoke.csv', index=False)
          print(f'Generated synthetic_smoke.csv with {len(smoke_df)} flows.')
          "

      - name: Run 1-Round 2-Client FL Smoke Test (Baseline)
        run: |
          python run_simulation.py \
            --rounds 1 \
            --clients 2 \
            --data-path synthetic_smoke.csv \
            --no-dp \
            --results-path results/ci_baseline_smoke.csv

      - name: Run 1-Round 2-Client FL Smoke Test (DP-SGD)
        run: |
          python run_simulation.py \
            --rounds 1 \
            --clients 2 \
            --data-path synthetic_smoke.csv \
            --dp \
            --epsilon 3.0 \
            --results-path results/ci_dp_smoke.csv
